# Local PostgreSQL for src/postgres_audit.py. Development only: the password is
# not a secret and the port is bound to this machine alone.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_DB: insurance
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d insurance"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
